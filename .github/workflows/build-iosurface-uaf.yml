name: Build IOSurface UAF Harness

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Find and Compile Harness
      run: |
        SOURCE_FILE=$(find harness -name "*.m" -type f | head -1)
        echo "Using source: $SOURCE_FILE"
        
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=15.0 \
          -framework IOKit \
          -framework Foundation \
          -framework CoreFoundation \
          -O2 \
          -o iosurface_uaf \
          "$SOURCE_FILE"
        
        file iosurface_uaf
    
    - name: Create App Bundle
      run: |
        mkdir -p Payload/IOSurfaceUAF.app
        cp iosurface_uaf Payload/IOSurfaceUAF.app/IOSurfaceUAF
        
        python3 << 'PYEOF'
import plistlib

info = {
    "CFBundleDevelopmentRegion": "en",
    "CFBundleExecutable": "IOSurfaceUAF",
    "CFBundleIdentifier": "com.jasonquiles.iosurfaceuaf",
    "CFBundleInfoDictionaryVersion": "6.0",
    "CFBundleName": "IOSurfaceUAF",
    "CFBundlePackageType": "APPL",
    "CFBundleShortVersionString": "1.0",
    "CFBundleVersion": "1",
    "LSRequiresIPhoneOS": True,
    "UIRequiresFullScreen": True,
    "UISupportedInterfaceOrientations": ["UIInterfaceOrientationPortrait"]
}

with open("Payload/IOSurfaceUAF.app/Info.plist", "wb") as f:
    plistlib.dump(info, f)

print("Info.plist created")
PYEOF
        
        zip -r IOSurfaceUAF.ipa Payload/
        ls -lh IOSurfaceUAF.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: IOSurfaceUAF-unsigned-ipa
        path: IOSurfaceUAF.ipa
        retention-days: 7
