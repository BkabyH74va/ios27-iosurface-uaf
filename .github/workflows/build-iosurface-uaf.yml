name: Build IOSurface UAF Harness

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Find and Compile Harness
      run: |
        SOURCE_FILE=$(find harness -name "*.m" -type f | head -1)
        echo "Using source: $SOURCE_FILE"
        
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=15.0 \
          -framework IOKit \
          -framework Foundation \
          -framework CoreFoundation \
          -O2 \
          -o iosurface_uaf \
          "$SOURCE_FILE"
        
        file iosurface_uaf
    
    - name: Create App Bundle
      run: |
        mkdir -p Payload/IOSurfaceUAF.app
        cp iosurface_uaf Payload/IOSurfaceUAF.app/IOSurfaceUAF
        
        # Create Info.plist using printf (no heredoc)
        printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0">' '<dict>' '    <key>CFBundleExecutable</key>' '    <string>IOSurfaceUAF</string>' '    <key>CFBundleIdentifier</key>' '    <string>com.jasonquiles.iosurfaceuaf</string>' '    <key>CFBundleName</key>' '    <string>IOSurfaceUAF</string>' '    <key>CFBundleVersion</key>' '    <string>1</string>' '    <key>CFBundleShortVersionString</key>' '    <string>1.0</string>' '    <key>LSRequiresIPhoneOS</key>' '    <true/>' '</dict>' '</plist>' > Payload/IOSurfaceUAF.app/Info.plist
        
        zip -r IOSurfaceUAF.ipa Payload/
        ls -lh IOSurfaceUAF.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: IOSurfaceUAF-unsigned-ipa
        path: IOSurfaceUAF.ipa
        retention-days: 7
