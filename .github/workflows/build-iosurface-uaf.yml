name: Build Kernel Write Exploit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Compile Kernel Write Exploit
      run: |
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=15.0 \
          -framework IOKit \
          -framework Foundation \
          -framework CoreFoundation \
          -framework CoreMedia \
          -framework VideoToolbox \
          -O2 \
          -o kernel_write \
          harness/kernel_write.m
        
        file kernel_write
    
    - name: Create App Bundle
      run: |
        mkdir -p Payload/KernelWrite.app
        cp kernel_write Payload/KernelWrite.app/KernelWrite
        
        printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0">' '<dict>' '    <key>CFBundleExecutable</key>' '    <string>KernelWrite</string>' '    <key>CFBundleIdentifier</key>' '    <string>com.jasonquiles.kernelwrite</string>' '    <key>CFBundleName</key>' '    <string>KernelWrite</string>' '    <key>CFBundleVersion</key>' '    <string>1</string>' '    <key>CFBundleShortVersionString</key>' '    <string>1.0</string>' '    <key>LSRequiresIPhoneOS</key>' '    <true/>' '</dict>' '</plist>' > Payload/KernelWrite.app/Info.plist
        
        zip -r KernelWrite.ipa Payload/
        ls -lh KernelWrite.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: KernelWrite-unsigned-ipa
        path: KernelWrite.ipa
        retention-days: 7
