name: Build Socket UAF Exploit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Compile Socket UAF
      run: |
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=15.0 \
          -framework Foundation \
          -O2 \
          -o socket_uaf \
          harness/socket_uaf.m
        
        echo "Build succeeded"
        ls -lh socket_uaf
    
    - name: Create IPA
      run: |
        mkdir -p Payload/SocketUAF.app
        cp socket_uaf Payload/SocketUAF.app/SocketUAF
        
        printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0">' '<dict>' '    <key>CFBundleExecutable</key>' '    <string>SocketUAF</string>' '    <key>CFBundleIdentifier</key>' '    <string>com.jasonquiles.socketuaf</string>' '    <key>CFBundleName</key>' '    <string>SocketUAF</string>' '    <key>CFBundleVersion</key>' '    <string>1</string>' '    <key>CFBundleShortVersionString</key>' '    <string>1.0</string>' '    <key>LSRequiresIPhoneOS</key>' '    <true/>' '    <key>UIFileSharingEnabled</key>' '    <true/>' '</dict>' '</plist>' > Payload/SocketUAF.app/Info.plist
        
        zip -r SocketUAF.ipa Payload/
        ls -lh SocketUAF.ipa
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: SocketUAF-unsigned-ipa
        path: SocketUAF.ipa
