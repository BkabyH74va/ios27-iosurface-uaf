name: Build Kernel Write Exploit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Compile
      run: |
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=15.0 \
          -framework IOKit \
          -framework Foundation \
          -O2 \
          -o kernel_rw \
          harness/kernel_rw.m
        
        echo "Build succeeded"
        ls -lh kernel_rw
    
    - name: Create IPA
      run: |
        mkdir -p Payload/KernelRW.app
        cp kernel_rw Payload/KernelRW.app/KernelRW
        
        cat > Payload/KernelRW.app/Info.plist << 'PLIST'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>KernelRW</string>
    <key>CFBundleIdentifier</key>
    <string>com.jasonquiles.kernelrw</string>
    <key>CFBundleName</key>
    <string>KernelRW</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0</string>
    <key>LSRequiresIPhoneOS</key>
    <true/>
</dict>
</plist>
PLIST
        
        zip -r KernelRW.ipa Payload/
        ls -lh KernelRW.ipa
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: KernelRW-unsigned-ipa
        path: KernelRW.ipa
